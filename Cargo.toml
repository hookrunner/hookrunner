[workspace]
members = ["crates/shared", "crates/server", "crates/client", "crates/game"]
default-members = ["crates/shared", "crates/server", "crates/client"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["std", "async_executor", "serialize"] }
lightyear = { version = "=0.26.4", default-features = false, features = ["std", "replication", "prediction", "interpolation", "input_native", "websocket", "raw_connection"] }
serde = { version = "1", features = ["derive"] }
hookrunner-shared = { path = "crates/shared" }
hookrunner-client = { path = "crates/client" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.web]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16
