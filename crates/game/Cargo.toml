[package]
name = "hookrunner-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hookrunner"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render",
    "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_window",
    "bevy_winit", "bevy_log", "bevy_ui", "bevy_ui_render", "bevy_text",
    "default_font", "png", "bevy_gltf", "bevy_scene", "reflect_auto_register",
] }
lightyear = { workspace = true, features = ["client"] }
hookrunner-shared.workspace = true
hookrunner-client.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Document", "Element"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland", "multi_threaded"] }

[build-dependencies]
png = "=0.18.1"
serde_json = "1"
