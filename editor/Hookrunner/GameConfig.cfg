{
  "version": 9,
  "name": "Hookrunner",
  "fileformats": [
    {
      "format": "Quake3 (Valve)"
    }
  ],
  "filesystem": {
    "searchpath": "assets/stormkeep/source",
    "packageformat": {
      "extension": ".pk3",
      "format": "zip"
    }
  },
  "materials": {
    "root": "textures",
    "extensions": [
      ".tga",
      ".png",
      ".jpg"
    ],
    "shaderSearchPath": "scripts",
    "excludes": [
      "*_glow",
      "*_norm",
      "*_gloss"
    ]
  },
  "entities": {
    "definitions": [
      "Hookrunner.fgd"
    ],
    "defaultcolor": "0.6 0.6 0.6 1.0"
  },
  "tags": {
    "brush": [
      {
        "name": "Trigger",
        "attribs": [
          "transparent"
        ],
        "match": "classname",
        "pattern": "trigger_*",
        "material": "common/trigger"
      }
    ],
    "brushface": [
      {
        "name": "Clip",
        "attribs": [
          "transparent"
        ],
        "match": "material",
        "pattern": "common/*clip"
      },
      {
        "name": "Caulk",
        "attribs": [
          "transparent"
        ],
        "match": "material",
        "pattern": "common/caulk"
      }
    ]
  },
  "faceattribs": {
    "defaults": {
      "scale": [
        0.25,
        0.25
      ]
    },
    "surfaceflags": [],
    "contentflags": []
  },
  "softMapBounds": "-8192 -8192 -4096 8192 8192 4096"
}
